spring:
  application:
    name: investigator
  # Secrets as files, one property per file (the compose stack mounts the approval keys here; Kubernetes secrets the
  # same way). Absent on a developer's machine: then nothing is imported.
  config:
    import: optional:configtree:${APPROVAL_KEYS_DIR:/run/secrets/approval/}
  # The investigator's own schema; the role owns it and nothing else (deploy/compose/postgres/initdb/40-investigator.sh).
  datasource:
    url: ${INVESTIGATOR_DB_URL:jdbc:postgresql://localhost:5432/disputes}
    username: ${INVESTIGATOR_DB_USER:investigator}
    password: ${INVESTIGATOR_DB_PASSWORD:investigator}
    hikari:
      maximum-pool-size: 5
  flyway:
    schemas: investigation
    create-schemas: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
      properties:
        # One case can take minutes (several model calls); the consumer must not be evicted meanwhile.
        max.poll.interval.ms: 900000
    producer:
      acks: all
    listener:
      ack-mode: manual_immediate

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # The Prometheus scrape endpoint (ADR 0008) next to the probes.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # One trace per case, every case (ADR 0008). OTLP export is off unless switched on with its endpoint (compose does,
  # task 2.12: OTEL_TRACES_EXPORT=true and MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT). An empty endpoint
  # is not "no endpoint": Boot would build the exporter and fail, so the endpoint is left undefined here.
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT:false}
  # Logs stay on stdout as JSON; no OTLP log export.
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    tags:
      application: investigator
    # Histogram buckets for the percentiles on the dashboard (p50/p90 cost per case, p99 model latency, ...).
    distribution:
      percentiles-histogram:
        dispute.llm.call: true
        dispute.tool.call: true
        dispute.action: true
        dispute.case.cost: true
        dispute.case.tokens: true
        dispute.approval.latency: true

# JSON logs (ECS): the trace and span ids and the dispute id (MDC) on every line; card numbers masked in every string.
# LOG_FORMAT= (empty) gives plain text for reading locally.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        version: '@project.version@'
    json:
      customizer: dev.disputeagent.investigator.bootstrap.MaskingLogCustomizer

# Model ids, effort, token caps and prices live here and in the environment, never in code (ADR 0001).
investigator:
  llm:
    # replay (CI, load test; needs no key) | recording (live, writes fixtures) | anthropic (live)
    adapter: ${LLM_ADAPTER:replay}
    live: anthropic
    fixtures-dir: ${LLM_FIXTURES_DIR:../evals/fixtures/llm}
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:}
    # Retries are configured in exactly one place: Resilience4j around the port (investigator.resilience, ADR 0008).
    max-retries: 0
    # The SDK's own limit, a backstop behind the time limiter's attempt-timeout.
    timeout: PT5M
    investigator:
      model: ${INVESTIGATOR_MODEL:claude-opus-5-5}
      effort: ${INVESTIGATOR_EFFORT:medium}
      max-tokens: 16000
    triage:
      model: ${TRIAGE_MODEL:claude-haiku-5-5}
      effort: ${TRIAGE_EFFORT:low}
      max-tokens: 1000
    # Dollars per million tokens (ADR 0001); the version is recorded with every cost. The published prices on
    # 20 Nov 2026, re-checked unchanged on 25 Nov 2026 (task 3.1): input, output, cache reads and 5-minute cache
    # writes (1.25x input). Haiku: the price for prompts up to 100K tokens (a longer prompt costs five times more).
    prices:
      version: "2026-11-20"
      models:
        claude-opus-5-5: {input: 4.00, output: 20.00, cache-read: 0.20, cache-write: 5.00}
        claude-haiku-5-5: {input: 0.10, output: 0.50, cache-read: 0.01, cache-write: 0.125}
  mcp:
    ledger-url: ${LEDGER_MCP_URL:http://localhost:8081/mcp}
    policy-url: ${POLICY_MCP_URL:http://localhost:8082/mcp}
    actions-url: ${ACTIONS_MCP_URL:http://localhost:8083/mcp}
    connect-timeout: PT5S
    request-timeout: PT30S
    max-response-bytes: 1000000
  # Around the model call (ADR 0008), outermost first: retry, circuit breaker, bulkhead, time limiter. A case the model
  # cannot serve after the retries, or while the breaker is open, is parked and replayed (task 2.10).
  resilience:
    attempt-timeout: ${LLM_ATTEMPT_TIMEOUT:PT4M}
    max-attempts: 3
    first-backoff: PT2S
    backoff-multiplier: 2.0
    jitter: 0.5
    max-backoff: PT30S
    max-concurrent-calls: ${LLM_MAX_CONCURRENT_CALLS:8}
    bulkhead-wait: PT10S
    breaker-window: 20
    breaker-minimum-calls: 10
    breaker-failure-rate: 50
    breaker-open-for: PT30S
    breaker-half-open-calls: 3
  # Failure injection (task 2.14): /faults makes the replay adapter answer "overloaded". Load-test stack only; the
  # investigator refuses to start with it on any other adapter.
  faults:
    enabled: ${FAULT_INJECTION:false}
  # The replay of parked cases (ADR 0008): every sweep-interval, due cases go to disputes.replay (held in-flight while
  # they run); the wait after a park starts at first-delay and doubles, up to max-delay; after max-replays a case that
  # parks again escalates.
  replay:
    sweep-interval: ${REPLAY_SWEEP_INTERVAL:PT10S}
    batch-size: 50
    max-replays: 5
    first-delay: ${REPLAY_FIRST_DELAY:PT30S}
    max-delay: PT10M
    in-flight: PT15M
  # The outbox relay (ADR 0008): events are saved with the case and published from investigation.outbox.
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT0.2S}
    batch-size: 100
  # The reviewer API (X-Reviewer-Key). Blank: the API answers 503 and nothing can be approved.
  reviewer:
    api-key: ${REVIEWER_API_KEY:}
  kafka:
    opened-topic: disputes.opened
    decided-topic: disputes.decided
    approval-requested-topic: disputes.approval-requested
    # Parked cases re-run from the start (ADR 0008).
    replay-topic: disputes.replay
    # Malformed events, and events still failing after the error handler's retries, with the reason in headers.
    dlq-topic: disputes.dlq
    group-id: investigator
    partitions: 3
    publish-timeout: PT10S
  budget:
    max-model-calls: 12
    max-tool-calls: 40
    max-tokens: 400000
    max-wall-clock: PT10M
    decision-retries: 1
  # Must match data/datagen/policy.py and data/policy-corpus.
  policy:
    time-limit-days: 120
    provisional-credit-limit-minor: 300000
  skills-dir: ${INVESTIGATOR_SKILLS_DIR:../skills}
