[project]
name = "policy-mcp"
version = "0.1.0"
description = "MCP server over the dispute policy corpus (Streamable HTTP)"
requires-python = ">=3.13"
# mcp and fastapi are pinned in docs/ROADMAP.md; a bump must pass tests/test_tools_list_contract.py.
dependencies = [
    "mcp==2.3.0",
    "fastapi==0.162.0",
    "jsonschema>=4.26.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
