[project]
name = "load-shim"
version = "0.1.0"
description = "Load-test shim: publishes disputes.opened, awaits disputes.decided, reports end-to-end latency (task 2.13)"
requires-python = ">=3.13"
dependencies = [
    "aiokafka==0.15.0",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.3.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
