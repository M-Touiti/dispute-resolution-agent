name: Nightly live evaluation

# ADR 0009, section 4: the day's 30-case slice of golden set v2 runs against the live API under a spend cap the eval
# runner checks before each case, is graded against evals/baseline/live-thresholds.json, and its result is committed
# to the branch eval-nightly (never to main). Costs about $2 a run.
#
# Needs: the repository secret ANTHROPIC_API_KEY and a monthly spend limit in the Anthropic Console. The schedule
# runs only while the repository variable NIGHTLY_EVAL_ENABLED is "true"; a run by hand always runs.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:
    inputs:
      cases:
        description: "Only the slice's first N cases (empty: the whole slice of 30)"
        required: false
        default: ""
      date:
        description: "The day whose slice runs, YYYY-MM-DD (empty: today, UTC)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly live evaluation
    if: github.event_name == 'workflow_dispatch' || vars.NIGHTLY_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the commit to eval-nightly
    env:
      CAP_MICRO_USD: "5000000" # $5 a run (ADR 0009)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::the repository secret ANTHROPIC_API_KEY is not set"
            exit 1
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: investigator/**/pom.xml
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Generate the dataset
        working-directory: data
        run: uv run --locked python generate.py
      - name: Start the read servers
        working-directory: deploy/compose
        run: docker compose up -d --build --wait --wait-timeout 300 postgres ledger-mcp policy-mcp
      - name: Build the investigator
        working-directory: investigator
        run: ./mvnw -B -ntp -q -pl bootstrap -am package -DskipTests
      - name: Select the day's slice
        working-directory: evals
        env:
          CASES: ${{ inputs.cases }}
          DAY: ${{ inputs.date }}
        run: |
          args=(--out runs/nightly/golden.json)
          if [ -n "$CASES" ]; then args+=(--limit "$CASES"); fi
          if [ -n "$DAY" ]; then args+=(--date "$DAY"); fi
          uv run --locked python -m evaltools.nightly select "${args[@]}"
      - name: Run the slice live
        working-directory: investigator
        env:
          LLM_ADAPTER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_GOLDEN: ../evals/runs/nightly/golden.json
          EVAL_OUT: ../evals/runs/nightly
          EVAL_MAX_COST_MICRO_USD: ${{ env.CAP_MICRO_USD }}
        run: java -jar bootstrap/target/investigator-bootstrap-*.jar --spring.profiles.active=eval
      - name: Grade against the live thresholds
        id: grade
        working-directory: evals
        run: |
          if uv run --locked python -m evaltools.grade --results runs/nightly --golden runs/nightly/golden.json \
              --mode live; then
            echo "gate=pass" >> "$GITHUB_OUTPUT"
          else
            echo "gate=fail" >> "$GITHUB_OUTPUT"
          fi
      - name: Job summary
        working-directory: evals
        env:
          GATE: ${{ steps.grade.outputs.gate }}
        run: uv run --locked python -m evaltools.nightly summary --results runs/nightly --gate "$GATE" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the result to eval-nightly
        env:
          GATE: ${{ steps.grade.outputs.gate }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          day=$(python3 -c "import json; print(json.load(open('evals/runs/nightly/golden.json'))['nightly']['date'])")
          dir="evals/nightly/${day}-run${GITHUB_RUN_ID}"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$remote" eval-nightly > /dev/null; then
            git fetch --depth 1 "$remote" eval-nightly:eval-nightly
            git worktree add "$RUNNER_TEMP/nightly" eval-nightly
          else
            git worktree add --orphan -b eval-nightly "$RUNNER_TEMP/nightly"
          fi
          (cd evals && uv run --locked python -m evaltools.nightly keep --results runs/nightly \
              --out "$RUNNER_TEMP/nightly/$dir" --commit "$GITHUB_SHA" --gate "$GATE")
          cd "$RUNNER_TEMP/nightly"
          git add "$dir"
          git commit -q -m "nightly: ${day} (${GATE}), ${GITHUB_SHA:0:7}"
          git push -q "$remote" eval-nightly
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-eval-run
          path: evals/runs/nightly/
          retention-days: 30
      - name: Fail on the gate
        if: steps.grade.outputs.gate == 'fail'
        run: |
          echo "::error::the live run failed its thresholds (see the job summary)"
          exit 1
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
