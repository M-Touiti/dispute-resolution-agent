name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  java:
    name: Java (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [investigator, mcp-servers/ledger-mcp, mcp-servers/actions-mcp]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/**/pom.xml
      # ledger-mcp's tests run PostgreSQL (Testcontainers) loaded with the generated seed; they fail without it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.project == 'mcp-servers/ledger-mcp'
        with:
          enable-cache: true
          cache-dependency-glob: data/uv.lock
      - name: Generate the seed
        if: matrix.project == 'mcp-servers/ledger-mcp'
        working-directory: data
        run: uv run --locked python generate.py
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-${{ strategy.job-index }}
          path: ${{ matrix.project }}/**/target/surefire-reports/
          retention-days: 7

  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [data, evals, mcp-servers/policy-mcp]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: Install (Python from .python-version, dependencies from uv.lock)
        run: uv sync --locked
      # policy-mcp's retrieval-quality test runs the production embedding model (ADR 0007); keep it between runs.
      - name: Cache the embedding model
        if: matrix.project == 'mcp-servers/policy-mcp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-bge-small-en-v1.5-51f1bd0a
      - name: Generate the dataset (the golden set is checked against it)
        if: matrix.project == 'evals'
        working-directory: data
        run: uv run --locked python generate.py
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed

  eval:
    name: Evaluation (replay)
    needs: [java, python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: investigator/**/pom.xml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Generate the dataset
        working-directory: data
        run: uv run --locked python generate.py
      # Only what the investigation calls: the two read servers and their database. No Kafka, no actions server.
      - name: Start the read servers
        working-directory: deploy/compose
        run: docker compose up -d --build --wait --wait-timeout 300 postgres ledger-mcp policy-mcp
      - name: Build the investigator
        working-directory: investigator
        run: ./mvnw -B -ntp -q -pl bootstrap -am package -DskipTests
      # Replay only (ADR 0006): no API key exists in CI, and a fixture miss leaves the case unanswered, which fails
      # the gate below rather than calling the model.
      - name: Run the golden set
        working-directory: investigator
        run: java -jar bootstrap/target/investigator-bootstrap-*.jar --spring.profiles.active=eval
        env:
          LLM_ADAPTER: replay
      - name: Grade against the baseline
        working-directory: evals
        run: uv run --locked python -m evaltools.grade
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-run
          path: evals/runs/latest/
          retention-days: 14
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  compose:
    name: Compose smoke test
    needs: [java, python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: data/uv.lock
      - name: Generate the seed
        working-directory: data
        run: uv run --locked python generate.py
      - name: Start the stack
        working-directory: deploy/compose
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        working-directory: deploy/compose
        run: ./smoke.sh
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
