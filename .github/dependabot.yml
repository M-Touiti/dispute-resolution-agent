# Weekly update pull requests. Minor and patch bumps are grouped per ecosystem; majors arrive one per pull request.
# A bump of the MCP SDK or the Anthropic SDK must pass the tools/list contract tests (docs/ROADMAP.md).
version: 2

updates:
  - package-ecosystem: maven
    directories:
      - /investigator
      - /mcp-servers/ledger-mcp
      - /mcp-servers/actions-mcp
    schedule:
      interval: weekly
      day: monday
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    # Kept at the version mcp-json-jackson3 uses, so the client and the servers validate alike: bumped by hand with
    # the MCP SDK (investigator/pom.xml, docs/ROADMAP.md pins table).
    ignore:
      - dependency-name: com.networknt:json-schema-validator

  - package-ecosystem: uv
    directories:
      - /data
      - /evals
      - /mcp-servers/policy-mcp
      - /performance/shim
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /mcp-servers/ledger-mcp
      - /mcp-servers/actions-mcp
      - /mcp-servers/policy-mcp
      - /performance/shim
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
      day: monday

  # The workflows, and the local composite action that scans images (its Trivy binary is pinned by hand).
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/trivy
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
