# The Java services expose Prometheus on their actuator port (management, 9080), policy-mcp on its only port. A
# kube-prometheus-stack release selects ServiceMonitors by its own release label: add it here or set
# serviceMonitorSelectorNilUsesHelmValues=false.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dispute-agent-java
  labels:
    app.kubernetes.io/part-of: dispute-agent
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [investigator, ledger-mcp, actions-mcp]
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dispute-agent-policy-mcp
  labels:
    app.kubernetes.io/part-of: dispute-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-mcp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
