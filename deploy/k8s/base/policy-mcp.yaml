# Policy retrieval (Streamable HTTP on 8082, /mcp; /health and /metrics on the same port) as the role
# policy_service. It ingests the corpus into its schema at start-up, so it runs as one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-mcp
  labels:
    app.kubernetes.io/name: policy-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Two ingesting pods at once would race on the policy schema.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-mcp
          image: dispute-agent/policy-mcp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: POSTGRES_HOST
              valueFrom: {configMapKeyRef: {name: dispute-agent-endpoints, key: POSTGRES_HOST}}
            - name: POSTGRES_PORT
              valueFrom: {configMapKeyRef: {name: dispute-agent-endpoints, key: POSTGRES_PORT}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: dispute-agent-endpoints, key: POSTGRES_DB}}
            - name: POLICY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-agent-db, key: policy-service-password}}
            - name: POLICY_DB_URL
              value: postgresql://policy_service:$(POLICY_DB_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            # DNS rebinding protection: the Service name is how the investigator reaches it; localhost for the probes
            # and port-forward.
            - name: POLICY_MCP_ALLOWED_HOSTS
              value: "127.0.0.1:*,localhost:*,[::1]:*,policy-mcp:*"
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Ingestion (embedding the corpus) runs before /health answers.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        # Placeholder: an overlay gives it the corpus (the local overlay mounts the repository's data/policy-corpus/).
        - name: corpus
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: policy-mcp
  labels:
    app.kubernetes.io/name: policy-mcp
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    app.kubernetes.io/name: policy-mcp
  ports:
    - name: http
      port: 8082
      targetPort: http
