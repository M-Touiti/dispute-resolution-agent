# PostgreSQL with pgvector, for the local cluster only: the image and the init scripts of the compose stack
# (deploy/compose/postgres/initdb, mounted from the kind node's /repo), loaded with data/generated/seed.sql on an empty
# volume. To reload after regenerating the data, delete the claim (deploy/k8s/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18-trixie
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: disputes
            - name: POSTGRES_USER
              value: disputes
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-agent-db, key: postgres-password}}
            # Read by the init scripts that create each service's role.
            - name: LEDGER_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-agent-db, key: ledger-reader-password}}
            - name: POLICY_SERVICE_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-agent-db, key: policy-service-password}}
            - name: INVESTIGATOR_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-agent-db, key: investigator-password}}
            - name: ACTIONS_SERVICE_PASSWORD
              valueFrom: {secretKeyRef: {name: dispute-agent-db, key: actions-service-password}}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: seed
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready --host 127.0.0.1 --username \"$POSTGRES_USER\" --dbname disputes"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready --host 127.0.0.1 --username \"$POSTGRES_USER\" --dbname disputes"]
            # Loading the seed on an empty volume takes a while; the server listens on 127.0.0.1 only meanwhile.
            initialDelaySeconds: 120
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          hostPath:
            path: /repo/deploy/compose/postgres/initdb
            type: Directory
        - name: seed
          hostPath:
            path: /repo/data/generated
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
