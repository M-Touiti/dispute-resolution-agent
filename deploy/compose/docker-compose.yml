# Local stack for development and the M2 load tests. From this directory:
#   (cd ../../data && uv run python generate.py)   # once: PostgreSQL loads data/generated/seed.sql on first start
#   docker compose up -d --build --wait
#   ./smoke.sh
# Host ports bind to 127.0.0.1 only. Image tags are pinned; bump them deliberately.

name: dispute-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: disputes
      POSTGRES_USER: ${POSTGRES_USER:-disputes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disputes}
      LEDGER_READER_PASSWORD: ${LEDGER_READER_PASSWORD:-ledger_reader}
      POLICY_SERVICE_PASSWORD: ${POLICY_SERVICE_PASSWORD:-policy_service}
      INVESTIGATOR_DB_PASSWORD: ${INVESTIGATOR_DB_PASSWORD:-investigator}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - type: bind
        source: ../../data/generated
        target: /seed
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$$POSTGRES_USER\" --dbname disputes"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Single-node KRaft broker. Containers use kafka:19092; the host uses localhost:9092.
  # Version matches the kafka-clients managed by Spring Boot 4.2.0.
  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: "-L_07n1dUzG2QQz8ZplXJQ"  # base64 of a fixed UUID; any 16-byte value works
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  ledger-mcp:
    build: ../../mcp-servers/ledger-mcp
    image: dispute-agent/ledger-mcp:dev
    environment:
      # Read-only role with SELECT on the ledger schema only (postgres/initdb/20-ledger-reader.sh).
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/disputes
      LEDGER_DB_USER: ledger_reader
      LEDGER_DB_PASSWORD: ${LEDGER_READER_PASSWORD:-ledger_reader}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  policy-mcp:
    build: ../../mcp-servers/policy-mcp
    image: dispute-agent/policy-mcp:dev
    environment:
      # DNS rebinding protection: the service name is how other containers reach it.
      POLICY_MCP_ALLOWED_HOSTS: "127.0.0.1:*,localhost:*,[::1]:*,policy-mcp:*"
      # Owns the policy schema only (postgres/initdb/30-policy-service.sh); ingests the corpus at start-up.
      POLICY_DB_URL: postgresql://policy_service:${POLICY_SERVICE_PASSWORD:-policy_service}@postgres:5432/disputes
    volumes:
      - ../../data/policy-corpus:/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  actions-mcp:
    build: ../../mcp-servers/actions-mcp
    image: dispute-agent/actions-mcp:dev
    environment:
      # Owns the actions schema, reads intake.disputes only (postgres/initdb/50-actions-service.sh).
      ACTIONS_DB_URL: jdbc:postgresql://postgres:5432/disputes
      ACTIONS_DB_USER: actions_service
      ACTIONS_DB_PASSWORD: ${ACTIONS_SERVICE_PASSWORD:-actions_service}
    volumes:
      # The public approval key only (ADR 0005): this server verifies tokens and cannot sign one.
      - approval-verify:/run/secrets/approval:ro
    depends_on:
      approval-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s


  # One-shot: the approval-token key pair (ADR 0005), generated on the first start and kept in two volumes. The
  # investigator gets the private key; actions-mcp gets only the public key. JDK only, single-file launcher.
  approval-keys:
    image: eclipse-temurin:21-jdk-noble
    command: ["java", "/scripts/GenerateApprovalKeys.java", "/keys/signing", "/keys/verify"]
    volumes:
      - ./approval-keys:/scripts:ro
      - approval-signing:/keys/signing
      - approval-verify:/keys/verify

  # The agent. LLM_ADAPTER=replay (default) serves evals/fixtures/llm and needs no key; recording and anthropic call
  # the live API with ANTHROPIC_API_KEY from the environment. Skills and fixtures are mounted from the repository.
  investigator:
    build: ../../investigator
    image: dispute-agent/investigator:dev
    environment:
      INVESTIGATOR_DB_URL: jdbc:postgresql://postgres:5432/disputes
      INVESTIGATOR_DB_USER: investigator
      INVESTIGATOR_DB_PASSWORD: ${INVESTIGATOR_DB_PASSWORD:-investigator}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LEDGER_MCP_URL: http://ledger-mcp:8081/mcp
      POLICY_MCP_URL: http://policy-mcp:8082/mcp
      ACTIONS_MCP_URL: http://actions-mcp:8083/mcp
      LLM_ADAPTER: ${LLM_ADAPTER:-replay}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INVESTIGATOR_MODEL: ${INVESTIGATOR_MODEL:-claude-opus-5-5}
      INVESTIGATOR_EFFORT: ${INVESTIGATOR_EFFORT:-medium}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-haiku-5-5}
      TRIAGE_EFFORT: ${TRIAGE_EFFORT:-low}
      # The reviewer API's key (X-Reviewer-Key), a stand-in for single sign-on. The default is for this local stack
      # only; to change it, set REVIEWER_API_KEY in deploy/compose/.env (compose reads .env from this folder, not
      # from the repository root) or in the shell.
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:-local-reviewer-key}
      # One trace per case to Tempo over OTLP/HTTP (ADR 0008).
      OTEL_TRACES_EXPORT: "true"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - ../../skills:/app/skills:ro
      - ../../evals/fixtures/llm:/app/fixtures
      # Spring config tree: each file is a property (investigator.approval.signing-key, ...verify-key).
      - approval-signing:/run/secrets/approval:ro
    depends_on:
      approval-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ledger-mcp:
        condition: service_healthy
      policy-mcp:
        condition: service_healthy
      # The investigator carries approved actions out on actions-mcp (ADR 0005).
      actions-mcp:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # Observability (ADR 0008, task 2.12): Prometheus scrapes every service, Tempo keeps the investigator's traces,
  # Grafana shows both with a dashboard provisioned from observability/grafana. All bound to 127.0.0.1.
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Distroless: no shell for a healthcheck; smoke.sh polls /ready from the host. Traces on a tmpfs owned by Tempo's
  # user (10001): they live as long as the stack does.
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001,mode=0755
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read-only browsing without a login, for this local stack only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dispute-agent.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Load test (task 2.13), only with the "perf" profile: performance/run.sh starts these. The shim publishes the golden
  # disputes and awaits their decisions; k6 drives it. The shim connects as the database owner: it deletes cases.
  load-shim:
    profiles: [perf]
    build: ../../performance/shim
    image: dispute-agent/load-shim:dev
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SHIM_DB_URL: postgresql://${POSTGRES_USER:-disputes}:${POSTGRES_PASSWORD:-disputes}@postgres:5432/disputes
      GOLDEN_SET: /golden/unauthorised-v1.json
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ../../evals/golden:/golden:ro
    depends_on:
      investigator:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  k6:
    profiles: [perf]
    image: grafana/k6:1.8.3
    volumes:
      - ../../performance/k6:/scripts:ro
    depends_on:
      load-shim:
        condition: service_healthy

volumes:
  postgres-data:
  approval-signing:
  approval-verify:
