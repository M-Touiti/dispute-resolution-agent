# Provisioned at start (task 2.12): Grafana needs no clicking. Fixed uids, so the dashboard JSON can refer to them.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span to the service's metrics around it.
      tracesToMetrics:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
