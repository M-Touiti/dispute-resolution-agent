# Tempo for the local stack (ADR 0008, task 2.12): receives the investigator's spans over OTLP/HTTP (4318) and serves
# them to Grafana (3200). Single binary, local storage on a tmpfs: traces live as long as the stack does.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
